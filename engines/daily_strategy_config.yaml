bands:
  active_min: 1.5
  active_max: 8.0
  passive_max: 12.0

momentum:
  slope_cutoff: 0.03         # ticks/min
  oc_momentum_ticks: 2       # OC0→OCk net ticks (monotonic)
  strong_steam_ticks: 3      # for B2L allowance

direction:
  default: "L2B"
  b2l_require_fav: true
  b2l_strong_only: true

letters:
  A: { allowed_bands: ["ACTIVE"], target_ticks: 2, base_stake: 1.0 }
  S: { allowed_bands: ["ACTIVE"], target_ticks: 2, base_stake: 1.0 }
  B: { allowed_bands: ["ACTIVE"], target_ticks: 3, base_stake: 1.2 }
  G: { allowed_bands: ["ACTIVE"], target_ticks: 4, base_stake: 1.5 }
  F: { allowed_bands: ["ACTIVE"], target_ticks: 2, base_stake: 0.8 }
  X: { allowed_bands: ["ACTIVE"], trigger: "fav_switch",   base_stake: 1.0 }
  R: { allowed_bands: ["ACTIVE"], trigger: "range_breakout", base_stake: 1.0 }
  L: { allowed_bands: ["ACTIVE"], target_ticks: 1, cap_per_runner: 3, base_stake: 0.5 }

caps:
  per_runner: 3
  rotation_sec: 30

late_preoff:
  enabled: true
  window_sec: 60
  target_ticks: 2
  max_attempts_per_runner: 1

risk:
  stake_scale_by_fav_rank: true
  stake_scale_by_slope: true
  micro_stake_fraction: 0.2

plans:
  corridors:
    fav_drift_ticks: 4
    breakout_ticks: 6
  triggers:
    fav_switch: true
    breakout: true

run_mode: "GATES_ONLY"    # "GATES_ONLY" | "PAPER" | "LIVE"
